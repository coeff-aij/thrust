name: Claude review

# Reviews a pull request when someone with write access runs it with the pull request's number,
# from the Actions tab or with `gh workflow run claude-review.yml -f pr=<number>`.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr }}
  cancel-in-progress: true

# This job holds the API key, so its actions are pinned to commits, its packages to hashes, and
# the key and the token are given only to the step that needs them.
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    env:
      PR: ${{ inputs.pr }}
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      # The script and the prompt come from the default branch; the pull request's head is
      # checked out apart, only to be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ env.PR }}/head
          path: pr-head
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/scripts/requirements.txt
      # The standard library's source of the toolchain the default branch pins, which the
      # review reads with its grep_std and read_std tools.
      - name: Fetch the standard library source
        # Without it the review runs, and its std tools say the source is not available.
        continue-on-error: true
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rust-src --no-self-update
          echo "RUST_SRC=$(rustup run "$channel" rustc --print sysroot)/lib/rustlib/src/rust/library" >> "$GITHUB_ENV"
      - if: ${{ env.HAS_API_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/claude_review.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --prompt .github/claude-review-prompt.md --head pr-head
      - if: ${{ env.HAS_API_KEY != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/claude_review.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --prompt .github/claude-review-prompt.md --head pr-head --dry-run
