on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: cargo doc --no-deps --document-private-items
      - run: echo '<meta http-equiv="refresh" content="0;url=thrust">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: 'target/doc'
  # Only the upstream repository has GitHub Pages: elsewhere the docs are built, not deployed.
  deploy:
    if: github.repository == 'coord-e/thrust' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
