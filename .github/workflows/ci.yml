on:
  pull_request:
  push:

permissions: {}

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: cargo clippy -- -D warnings
  # The ui tests that name a CoAR wrapper need the CoAR image built from fptprove, which CI does
  # not have; THRUST_UI_SKIP_COAR=1 skips them and runs the ones Z3 decides.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-z3
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
        env:
          THRUST_UI_SKIP_COAR: 1
