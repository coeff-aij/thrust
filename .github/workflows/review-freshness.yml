name: Review freshness

# Fails while the automated review (claude-review.yml) has not seen the pull request's latest
# changes to what Thrust does, or while one of its blocking or check comments has no reply; the
# failure says what to do. It holds no secret: its token only reads the pull request, and it runs
# the pull request's own copy of the script, as CI runs its code. A posted review triggers no
# workflow, so claude-review.yml runs this check again after each review.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/review_freshness.py --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD" --watch src/ thrust-macros/ std.rs
